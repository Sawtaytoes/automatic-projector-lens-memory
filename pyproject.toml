[project]
name = "automatic-projector-lens-memory"
version = "0.1.0"
description = "MQTT service that recalls a projector's lens-memory mode from the aspect ratio of the currently playing media"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kevin Ghadyani" }]
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2,<3",
    "requests>=2.31",
    "lxml>=5",
]

[project.optional-dependencies]
# ruff is PINNED, not floated: CI runs `pip install -e ".[dev]"` then
# `ruff check .`, so a new ruff release adds rules and turns main red with no
# code change (that is exactly what UP045 did on 2026-08-14). Bump this
# deliberately, with the fixes in the same PR.
dev = ["pytest>=8", "ruff==0.16.3"]

[project.urls]
Homepage = "https://github.com/Sawtaytoes/automatic-projector-lens-memory"

[project.scripts]
automatic-projector-lens-memory = "lens_memory.__main__:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lens_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
